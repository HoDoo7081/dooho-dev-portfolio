name: validate-design-artifacts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sql-schema:
    name: PostgreSQL 15 schema loads (31 tables) + seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -f projects/silverbridge-backend/design-package/02_SQL/schema.sql
      - name: Check migration equals schema
        run: diff projects/silverbridge-backend/design-package/02_SQL/schema.sql projects/silverbridge-backend/design-package/02_SQL/migrations/001_init_sb.sql
      - name: Check table count (README claims 31)
        run: |
          n=$(psql -Atc "select count(*) from information_schema.tables where table_schema='sb'")
          echo "sb tables: $n"
          test "$n" -eq 31
      - name: Apply seed
        run: psql -v ON_ERROR_STOP=1 -f projects/silverbridge-backend/design-package/02_SQL/seed.sql

  openapi:
    name: OpenAPI 3 contract is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint API contract
        run: npx --yes @redocly/cli@1.25.0 lint projects/silverbridge-backend/design-package/03_API/openapi.yaml --format=stylish --max-problems=1000

  reference-impl:
    name: Reference implementation tests (13) on PostgreSQL 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    defaults:
      run:
        working-directory: projects/silverbridge-backend/reference-impl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run db:setup
      - run: npm test

  cdk-and-image:
    name: CDK stack synthesizes; test-runner image builds and passes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CDK synth
        working-directory: projects/silverbridge-backend/aws-reference-architecture/cdk
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx cdk synth -q
      - name: Build test-runner image
        working-directory: projects/silverbridge-backend
        run: docker build -f reference-impl/Dockerfile -t sb-proof .
      - name: Run image against PostgreSQL (container = what Fargate runs)
        run: |
          docker run --rm --network host \
            -e PGHOST=localhost -e PGUSER=postgres -e PGPASSWORD=postgres -e PGDATABASE=postgres \
            sb-proof
