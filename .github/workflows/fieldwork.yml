name: Fieldwork local workflow tests
on:
  push:
    branches: [main]
    paths: ['projects/fieldwork-discovery-workbench/**', '.github/workflows/fieldwork.yml']
  pull_request:
    paths: ['projects/fieldwork-discovery-workbench/**', '.github/workflows/fieldwork.yml']
permissions:
  contents: read
jobs:
  fieldwork:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/fieldwork-discovery-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check

